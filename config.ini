; =====================================================================
; Internal Link Dashboard - configuration
;
; HOW TO RUN (local PC or server):
;   1. pip install -r requirements.txt
;   2. python app.py
;   3. Open http://localhost:8090  (team: http://SERVERNAME:8090)
;
; HOW IT COUNTS CLICKS:
;   Every link you add gets a short link like  http://SERVERNAME:8090/go/hr-form
;   Share the SHORT link with your users. Each click is counted, then the
;   user is instantly forwarded to the real destination.
;
; HOW TO DEPLOY TO THE SERVER:
;   1. Copy this whole folder to the server
;   2. Edit this file: set  sample_mode = false
;   3. pip install -r requirements.txt   then   python app.py
;   4. (optional) create a Windows Scheduled Task "At startup" that
;      runs:  python "C:\path\to\app.py"   so it survives reboots
; =====================================================================

[server]
host = 0.0.0.0
port = 8090

[health]
; How often to ping every link
check_interval_minutes = 30
timeout_seconds = 10
; Internal servers often use self-signed certificates
ssl_verify = false

[app]
; Seeds 4 demo links + demo click history when the database is empty,
; so you can see the dashboard working on your local PC.
; Set to false on the real server.
;
; NOTE: false only stops NEW seeding - it does not delete demo data that
; is already in data.db. If demo links are still showing after you set
; this to false, delete them on the Manage links page (deleting a link
; also removes its clicks and check history), or delete data.db to start
; clean.
sample_mode = false

; =====================================================================
; START BUTTONS  -  which app sits behind which link
;
; One [process:<name>] section per app you want a Start button for.
;   link    = the /go/<slug> name of the link on the dashboard
;   command = exactly what you would type in the terminal
;   cwd     = the folder you would type it in
;
; Two sections may share the same 'link' (a frontend plus a backend):
; the one button starts both, in the order they appear here.
;
; The dashboard itself is deliberately NOT listed - it cannot start
; itself. It is the one thing you start by hand after a reboot.
;
; Output from each app goes to  logs\<name>.log  - look there first
; when something says Started but stays Down.
; =====================================================================

[process:barcode]
link    = barcode-label-check
command = npm run dev
cwd     = D:\All Project for PCK\Compare PDF Barcode and EXCEL\react-app

[process:forming-box]
link    = forming-box
command = npm run dev
cwd     = D:\All Project for PCK\Forming Box File\src

[process:label-converter]
link    = label-converter
command = npm run dev
cwd     = D:\All Project for PCK\Make Excel to Excel\src

[process:bom-query-web]
link    = bom-query-web
command = python -m uvicorn main:app --port 8000
cwd     = D:\All Project for PCK\BOM Query Web\src


[process:pps-backend]
link    = pps-acs-wisdom-compare
command = py .\serve.py
cwd     = D:\All Project for PCK\PPS,ACS,WISDOM\DashBoard

[process:pps-frontend]
link    = pps-acs-wisdom-compare
command = py -m http.server 8080 --directory dist
cwd     = D:\All Project for PCK\PPS,ACS,WISDOM\DashBoard\frontend

; =====================================================================
; SCHEDULED JOBS  -  things that run on a timer, not things you visit
;
; A job is a batch program somewhere on the network - usually a Windows
; Scheduled Task - that should run daily or weekly and finish cleanly.
; It has no web page, so there is nothing for the health check to ping.
;
; Instead the JOB reports in to this dashboard when it finishes. The
; dashboard never contacts the job's machine, so jobs can live on any
; server, on any subnet, with no firewall rule pointing inwards.
;
; To add a job:
;   1. Add a [job:<slug>] section below
;   2. Copy reporter\report.py onto the machine that runs the job
;   3. Change that machine's Scheduled Task to run the job THROUGH it:
;
;      python C:\tools\report.py <slug> --url http://192.0.2.10:8090
;             -- <the command the task runs today>
;
; A job that stops running sends nothing, and shows here as Overdue -
; which is the failure you cannot see by reading its log.
; =====================================================================

[jobs]
; Shared secret the wrappers send as the X-Job-Token header.
; Leave blank to accept reports without a token.
token =

; expect_every = how often it should run      (30m / 6h / 24h / 7d)
; grace        = how late is still acceptable  (default 1h)
; host         = shown on the dashboard, not used to contact anything

[job:excel-bom-compare]
name         = Excel BOM Compare (FLOW4)
expect_every = 24h
grace        = 2h
host         = 192.0.2.20
