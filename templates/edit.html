{% extends "base.html" %}
{% block title %}Edit link · Link Watch{% endblock %}
{% block band %}
<section class="band-head">
  <div class="wrap">
    <div>
      <h1>Edit {{ link.name }}</h1>
      <p class="band-note">
        Editing changes where <code>/go/{{ link.slug }}</code> sends people. The
        click history stays with the link.
      </p>
    </div>
  </div>
</section>
{% endblock %}

{% block content %}

<section class="card">
  <form method="post" class="add-form add-form-column">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" required value="{{ link.name }}">
    </div>
    <div class="field grow">
      <label for="url">Destination URL</label>
      <input id="url" name="url" required class="input-mono" value="{{ link.url }}">
    </div>
    <div class="field">
      <label for="slug">Short name
        <span class="hint">changing it breaks links people already saved</span></label>
      <input id="slug" name="slug" class="input-mono" value="{{ link.slug }}">
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="submit">Save changes</button>
      <a class="btn" href="{{ url_for('manage') }}">Cancel</a>
    </div>
  </form>
</section>

{% endblock %}
