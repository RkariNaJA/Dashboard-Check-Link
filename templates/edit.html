{% extends "base.html" %}
{% block title %}Edit link · Link Watch{% endblock %}
{% block content %}

<div class="page-head">
  <h1>Edit link</h1>
</div>

<section class="card">
  <form method="post" class="add-form add-form-column">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" required value="{{ link.name }}">
    </div>
    <div class="field grow">
      <label for="url">Destination URL</label>
      <input id="url" name="url" required value="{{ link.url }}">
    </div>
    <div class="field">
      <label for="slug">Short name
        <span class="hint">changing it breaks links people already saved</span></label>
      <input id="slug" name="slug" value="{{ link.slug }}">
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="submit">Save changes</button>
      <a class="btn" href="{{ url_for('manage') }}">Cancel</a>
    </div>
  </form>
</section>

{% endblock %}
